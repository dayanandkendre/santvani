<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santvani Admin - Passcode Dashboard</title>
    <!-- Firebase SDK (v8.10.1 - matching menu.js) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

        /* 🔒 1. Passcode Screen */
        #passcode-screen { background: #181818; padding: 30px; border-radius: 12px; border: 1px solid #ffb703; text-align: center; max-width: 380px; width: 100%; box-shadow: 0 4px 20px rgba(255,183,3,0.2); }
        #passcode-screen h2 { color: #ffb703; margin-bottom: 15px; }
        #pin-input { padding: 12px; width: 100%; font-size: 18px; text-align: center; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 15px; letter-spacing: 4px; }
        #pin-btn { padding: 10px 20px; background: #ffb703; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }

        /* 📊 2. Main Admin Dashboard */
        #admin-dashboard { display: none; width: 100%; max-width: 900px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 20px; border-radius: 10px; border-left: 5px solid #ffb703; margin-bottom: 20px; }
        .header h2 { color: #ffb703; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #222; color: #aaa; border: 1px solid #333; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #ffb703; color: #000; border-color: #ffb703; }

        .content-box { background: #121212; border: 1px solid #222; border-radius: 10px; padding: 20px; }
        .card { background: #1a1a1a; border-left: 4px solid #ffb703; border-radius: 8px; padding: 15px; margin-bottom: 12px; position: relative; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .card-title { color: #ffb703; font-weight: bold; font-size: 15px; }
        .card-time { color: #888; font-size: 12px; }
        .page-badge { background: #252525; color: #ffb703; font-size: 11px; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .card-text { color: #e0e0e0; font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
        .delete-btn { color: #ff4d4d; background: none; border: none; cursor: pointer; float: right; font-size: 14px; }
    </style>
</head>
<body>

    <!-- PASSCODE SCREEN -->
    <div id="passcode-screen">
        <h2><i class="fa-solid fa-lock"></i> Santvani Admin</h2>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 15px;">पाहण्यासाठी ४ अंकांचा पासकोड टाका:</p>
        <input type="password" id="pin-input" maxlength="4" placeholder="••••">
        <button id="pin-btn" onclick="checkPin()">लॉगिन करा</button>
        <p id="error-msg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px; display: none;">चुकीचा पासकोड!</p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="admin-dashboard">
        <div class="header">
            <h2><i class="fa-solid fa-gauge"></i> संतवाणी ॲडमिन पॅनेल</h2>
            <button onclick="location.reload()" style="background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;"><i class="fa-solid fa-power-off"></i> बाहेर पडा</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-comments" onclick="switchTab('comments')">💬 सर्व कमेंट्स (<span id="count-comments">0</span>)</button>
            <button class="tab-btn" id="tab-contacts" onclick="switchTab('contacts')">📩 संपर्क मेसेजेस (<span id="count-contacts">0</span>)</button>
        </div>

        <div class="content-box">
            <div id="comments-section">
                <div id="comments-list">डेटा लोड होत आहे...</div>
            </div>
            <div id="contacts-section" style="display: none;">
                <div id="contacts-list">डेटा लोड होत आहे...</div>
            </div>
        </div>
    </div>

    <script>
        // PASSCODE LOGIC
        function checkPin() {
            const pin = document.getElementById("pin-input").value;
            if (pin === "9112") {
                document.getElementById("passcode-screen").style.display = "none";
                document.getElementById("admin-dashboard").style.display = "block";
                document.body.style.alignItems = "flex-start";
                initFirebaseAdmin();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        // FIREBASE ADMIN LOGIC
        function initFirebaseAdmin() {
            // Firebase Config Matching menu.js
            const firebaseConfig = {
                apiKey: "AIzaSyBQTDVzvz5tFktEEsnPZQ6G_ADoxGL0ZW4",
                authDomain: "santvani-48d18.firebaseapp.com",
                databaseURL: "https://santvani-48d18-default-rtdb.firebaseio.com",
                projectId: "santvani-48d18",
                storageBucket: "santvani-48d18.firebasestorage.app",
                messagingSenderId: "769467907364",
                appId: "1:769467907364:web:4fe85b182eb43359f707b1"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }

            const db = firebase.database();

            // 1. ALL COMMENTS FETCHING
            db.ref("comments").on("value", function(snapshot) {
                const list = document.getElementById("comments-list");
                list.innerHTML = "";
                let totalCount = 0;

                if (!snapshot.exists()) {
                    list.innerHTML = "<p style='color:#888'>अजून एकही कमेंट आलेली नाही.</p>";
                    document.getElementById("count-comments").innerText = "0";
                    return;
                }

                snapshot.forEach(function(pageSnap) {
                    const pageId = pageSnap.key;
                    pageSnap.forEach(function(commentSnap) {
                        totalCount++;
                        const data = commentSnap.val();
                        const commentKey = commentSnap.key;

                        const card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="card-title"><i class="fa-solid fa-user"></i> ${data.name || 'Anonymous'}</span>
                                <span class="card-time">${data.timestamp || ''}</span>
                            </div>
                            <div class="page-badge">📌 Page Path: /${pageId.replace(/_/g, '/')}</div>
                            <p class="card-text">${data.text || ''}</p>
                            <button class="delete-btn" onclick="deleteComment('${pageId}', '${commentKey}')"><i class="fa-solid fa-trash"></i> डिलीट</button>
                            <div style="clear:both;"></div>
                        `;
                        list.prepend(card);
                    });
                });
                document.getElementById("count-comments").innerText = totalCount;
            });

            // 2. CONTACT ENQUIRIES FETCHING
            db.ref("contacts").on("value", function(snapshot) {
                const list = document.getElementById("contacts-list");
                list.innerHTML = "";
                let totalCount = 0;

                if (!snapshot.exists()) {
                    list.innerHTML = "<p style='color:#888'>अजून एकही मेसेज आलेला नाही.</p>";
                    document.getElementById("count-contacts").innerText = "0";
                    return;
                }

                snapshot.forEach(function(childSnap) {
                    totalCount++;
                    const data = childSnap.val();
                    const key = childSnap.key;

                    const card = document.createElement("div");
                    card.className = "card";
                    card.style.borderLeftColor = "#1877F2";
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-title" style="color:#1877F2;"><i class="fa-solid fa-envelope"></i> ${data.name || 'User'}</span>
                            <span class="card-time">${data.timestamp || ''}</span>
                        </div>
                        <p style="color:#aaa; font-size:12px; margin-bottom:5px;">📞 Mobile/Email: ${data.email || data.phone || 'N/A'}</p>
                        <p class="card-text">${data.message || data.text || ''}</p>
                        <button class="delete-btn" onclick="deleteContact('${key}')"><i class="fa-solid fa-trash"></i> डिलीट</button>
                        <div style="clear:both;"></div>
                    `;
                    list.prepend(card);
                });
                document.getElementById("count-contacts").innerText = totalCount;
            });
        }

        // TAB SWITCHING LOGIC
        function switchTab(tab) {
            if (tab === 'comments') {
                document.getElementById("comments-section").style.display = "block";
                document.getElementById("contacts-section").style.display = "none";
                document.getElementById("tab-comments").classList.add("active");
                document.getElementById("tab-contacts").classList.remove("active");
            } else {
                document.getElementById("comments-section").style.display = "none";
                document.getElementById("contacts-section").style.display = "block";
                document.getElementById("tab-comments").classList.remove("active");
                document.getElementById("tab-contacts").classList.add("active");
            }
        }

        // DELETE FUNCTIONS
        function deleteComment(pageId, commentKey) {
            if (confirm("तुम्हाला ही कमेंट नक्की डिलीट करायची आहे का?")) {
                firebase.database().ref("comments/" + pageId + "/" + commentKey).remove();
            }
        }
        function deleteContact(key) {
            if (confirm("हा मेसेज नक्की डिलीट करायचा आहे का?")) {
                firebase.database().ref("contacts/" + key).remove();
            }
        }
    </script>
</body>
</html>
