<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santvani Admin - Portal</title>
    <!-- Favicon Integration -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK (v8.10.1) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; transition: all 0.25s ease; }
        
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        /* 🔒 PASSCODE CARD */
        #passcode-screen { 
            background: #1e293b; 
            padding: 40px 30px; 
            border-radius: 20px; 
            border: 1px solid #334155; 
            text-align: center; 
            max-width: 380px; 
            width: 100%; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            background: #1e293b;
            border: 2px solid #e11d48;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.25);
            overflow: hidden;
        }

        .brand-icon img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        #passcode-screen h2 { 
            font-size: 22px; 
            font-weight: 800; 
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px; 
        }

        #passcode-screen p { color: #94a3b8; font-size: 13px; margin-bottom: 22px; }

        #pin-input { 
            padding: 12px; 
            width: 100%; 
            font-size: 20px; 
            text-align: center; 
            border-radius: 10px; 
            border: 1.5px solid #475569; 
            background: #0f172a; 
            color: #f8fafc; 
            letter-spacing: 8px; 
            outline: none; 
            margin-bottom: 16px;
        }

        #pin-input:focus { 
            border-color: #f59e0b; 
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        #pin-btn { 
            padding: 12px; 
            background: #f59e0b; 
            color: #0f172a; 
            border: none; 
            font-weight: 700; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 15px; 
        }

        #pin-btn:hover { background: #d97706; color: #fff; }

        #error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; font-weight: 600; }

        /* 📊 MAIN DASHBOARD */
        #admin-dashboard { display: none; width: 100%; max-width: 900px; margin-top: 20px; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #1e293b; 
            padding: 18px 24px; 
            border-radius: 16px; 
            border: 1px solid #334155; 
            margin-bottom: 20px; 
        }
        
        .header h2 { 
            color: #f59e0b; 
            font-size: 20px; 
            font-weight: 800;
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .header h2 img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
        
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            background: #1e293b; 
            color: #94a3b8; 
            border: 1px solid #334155; 
            font-weight: 700; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active { 
            background: #f59e0b; 
            color: #0f172a; 
            border-color: #f59e0b; 
        }

        .content-box { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            padding: 20px; 
        }

        .card { 
            background: #0f172a; 
            border-left: 4px solid #f59e0b; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 12px; 
            border-top: 1px solid #334155;
            border-right: 1px solid #334155;
            border-bottom: 1px solid #334155;
        }

        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .card-title { color: #f59e0b; font-weight: 700; font-size: 15px; }
        .card-time { color: #64748b; font-size: 12px; }
        
        .page-badge { 
            background: #334155; 
            color: #cbd5e1; 
            font-size: 12px; 
            padding: 3px 8px; 
            border-radius: 6px; 
            display: inline-block; 
            margin-bottom: 8px; 
            font-family: monospace;
        }

        .card-text { color: #e2e8f0; font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
        .card-contact-info { color: #38bdf8; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        
        .delete-btn { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1); 
            border: 1px solid rgba(239, 68, 68, 0.2); 
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer; 
            float: right; 
            font-size: 12px; 
            font-weight: 600;
        }

        .delete-btn:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <!-- 🔒 PASSCODE SCREEN -->
    <div id="passcode-screen">
        <div class="brand-icon">
            <img src="/favicon.ico" alt="Logo" onerror="this.src='https://santvani.co.in/favicon.ico';">
        </div>
        <h2>Santvani Admin Suite</h2>
        <p>प्रशासकीय पॅनेल उघडण्यासाठी पासकोड प्रविष्ट करा</p>
        
        <form onsubmit="checkPin(event)">
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" autofocus>
            <button type="submit" id="pin-btn">अ‍ॅक्सेस उघडा <i class="fa-solid fa-arrow-right"></i></button>
        </form>
        <p id="error-msg"><i class="fa-solid fa-circle-exclamation"></i> चुकीचा पासकोड!</p>
    </div>

    <!-- 📊 MAIN DASHBOARD -->
    <div id="admin-dashboard">
        <div class="header">
            <h2>
                <img src="/favicon.ico" alt="Logo" onerror="this.src='https://santvani.co.in/favicon.ico';">
                संतवाणी Admin Suite
            </h2>
            <button onclick="location.reload()" style="background: #334155; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight:600;"><i class="fa-solid fa-power-off"></i> बाहेर पडा</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-comments" onclick="switchTab('comments')"><i class="fa-solid fa-comments"></i> प्रतिक्रिया (<span id="count-comments">0</span>)</button>
            <button class="tab-btn" id="tab-contacts" onclick="switchTab('contacts')"><i class="fa-solid fa-paper-plane"></i> संपर्क संदेश (<span id="count-contacts">0</span>)</button>
        </div>

        <div class="content-box">
            <div id="comments-section">
                <div id="comments-list">डेटा लोड होत आहे...</div>
            </div>
            <div id="contacts-section" style="display: none;">
                <div id="contacts-list">डेटा लोड होत आहे...</div>
            </div>
        </div>
    </div>

    <script>
        function checkPin(e) {
            if(e) e.preventDefault();
            const pin = document.getElementById("pin-input").value;
            if (pin === "9112") {
                document.getElementById("passcode-screen").style.display = "none";
                document.getElementById("admin-dashboard").style.display = "block";
                document.body.style.alignItems = "flex-start";
                initFirebaseAdmin();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function initFirebaseAdmin() {
            const firebaseConfig = {
                apiKey: "AIzaSyBQTDVzvz5tFktEEsnPZQ6G_ADoxGL0ZW4",
                authDomain: "santvani-48d18.firebaseapp.com",
                databaseURL: "https://santvani-48d18-default-rtdb.firebaseio.com",
                projectId: "santvani-48d18",
                storageBucket: "santvani-48d18.firebasestorage.app",
                messagingSenderId: "769467907364",
                appId: "1:769467907364:web:4fe85b182eb43359f707b1"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }

            const db = firebase.database();

            // 1. LOAD COMMENTS
            try {
                db.ref("comments").on("value", function(snapshot) {
                    const list = document.getElementById("comments-list");
                    list.innerHTML = "";
                    let totalCount = 0;

                    if (!snapshot.exists()) {
                        list.innerHTML = "<p style='color:#94a3b8; text-align:center; padding:15px;'>अजून एकही प्रतिक्रिया आलेली नाही.</p>";
                        document.getElementById("count-comments").innerText = "0";
                        return;
                    }

                    snapshot.forEach(function(pageSnap) {
                        const pageId = pageSnap.key;
                        pageSnap.forEach(function(commentSnap) {
                            totalCount++;
                            const data = commentSnap.val() || {};
                            const commentKey = commentSnap.key;

                            const card = document.createElement("div");
                            card.className = "card";
                            card.innerHTML = `
                                <div class="card-header">
                                    <span class="card-title"><i class="fa-solid fa-user"></i> ${data.name || 'Anonymous'}</span>
                                    <span class="card-time">${data.timestamp || data.date || ''}</span>
                                </div>
                                <div class="page-badge">📌 /${pageId.replace(/_/g, '/')}</div>
                                <p class="card-text">${data.text || data.message || ''}</p>
                                <button class="delete-btn" onclick="deleteComment('${pageId}', '${commentKey}')"><i class="fa-solid fa-trash"></i> डिलीट</button>
                                <div style="clear:both;"></div>
                            `;
                            list.prepend(card);
                        });
                    });
                    document.getElementById("count-comments").innerText = totalCount;
                });
            } catch(e) {
                console.error("Comments error:", e);
            }

            // 2. LOAD CONTACTS (FORCED FETCH)
            function fetchContactsData() {
                const list = document.getElementById("contacts-list");
                db.ref("contacts").on("value", function(snapshot) {
                    list.innerHTML = "";
                    let totalCount = 0;

                    if (!snapshot.exists()) {
                        list.innerHTML = "<p style='color:#94a3b8; text-align:center; padding:15px;'>अजून एकही संपर्क संदेश आलेला नाही.</p>";
                        document.getElementById("count-contacts").innerText = "0";
                        return;
                    }

                    snapshot.forEach(function(childSnap) {
                        totalCount++;
                        const data = childSnap.val() || {};
                        const key = childSnap.key;

                        const name = data.name || 'User';
                        const email = data.email || 'माहिती उपलब्ध नाही';
                        const message = data.message || '';
                        const date = data.date || '';

                        const card = document.createElement("div");
                        card.className = "card";
                        card.style.borderLeftColor = "#38bdf8";
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="card-title" style="color:#38bdf8;"><i class="fa-solid fa-envelope"></i> ${name}</span>
                                <span class="card-time">${date}</span>
                            </div>
                            <div class="card-contact-info">📧 ईमेल: ${email}</div>
                            <div class="card-text">💬 संदेश: ${message}</div>
                            <button class="delete-btn" onclick="deleteContact('${key}')"><i class="fa-solid fa-trash"></i> डिलीट</button>
                            <div style="clear:both;"></div>
                        `;
                        list.prepend(card);
                    });

                    document.getElementById("count-contacts").innerText = totalCount;
                }, function(error) {
                    console.error("Contacts fetch error:", error);
                    list.innerHTML = "<p style='color:#ef4444; text-align:center; padding:15px;'>डेटा लोड करताना एरर आली. Firebase Rules तपासा.</p>";
                });
            }

            // Call function immediately
            fetchContactsData();
        }

        // TAB SWITCHING
        function switchTab(tab) {
            const commentsSec = document.getElementById("comments-section");
            const contactsSec = document.getElementById("contacts-section");
            const btnComments = document.getElementById("tab-comments");
            const btnContacts = document.getElementById("tab-contacts");

            if (tab === 'comments') {
                commentsSec.style.display = "block";
                contactsSec.style.display = "none";
                btnComments.classList.add("active");
                btnContacts.classList.remove("active");
            } else {
                commentsSec.style.display = "none";
                contactsSec.style.display = "block";
                btnComments.classList.remove("active");
                btnContacts.classList.add("active");
            }
        }

        function deleteComment(pageId, commentKey) {
            if (confirm("तुम्हाला ही प्रतिक्रिया नक्की डिलीट करायची आहे का?")) {
                firebase.database().ref("comments/" + pageId + "/" + commentKey).remove();
            }
        }
        function deleteContact(key) {
            if (confirm("हा संदेश नक्की डिलीट करायचा आहे का?")) {
                firebase.database().ref("contacts/" + key).remove();
            }
        }
    </script>
</body>
</html>
